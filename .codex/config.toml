# Native automatic delegation is contained until a scope-bound execution
# entry is independently verified. Keep role adapters and saved workflows;
# agents must not re-enable this flag as an implementation prerequisite.
# The desktop workspace root also needs its minimal local .codex projection.
[features]
memories = true
multi_agent = false

[agents]
enabled = false
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
interrupt_message = false

# Memory extraction is intentionally kept off external-context threads so web,
# MCP, and tool-search transcripts cannot silently become durable project
# memory. Luna handles the narrow extraction/consolidation work; PM owns lesson
# eligibility, while actual promotion also requires trusted-host attestation.
[memories]
generate_memories = true
use_memories = true
disable_on_external_context = true
extract_model = "gpt-5.6-luna"
consolidation_model = "gpt-5.6-luna"
