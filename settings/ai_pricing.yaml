# AI Provider Pricing Table — USD per million tokens
# AI Provider 定價表 — 每百萬 tokens 美元
#
# Last updated: 2026-09-09 (Sonnet 5 comments only; other prices not re-audited)
# 最後更新：2026-09-09（只校準 Sonnet 5 註解；其餘價格未重審）
#
# Source: official pricing pages (anthropic.com, openai.com)
# 來源：官方定價頁
# anthropic 條目於 2026-06-14 對齊 anthropic.com pricing：
#   opus-4.8 $5/$25、sonnet-4.6 $3/$15、haiku-4.5 $1/$5（per MTok）。
# 2026-07-10 新增 claude-sonnet-5；2026-09-09 官方確認原 intro 價轉為標準價。
# 退役型號保留為 active:false（fail-closed 拒呼叫），不刪除，
# 符合 pricing.rs Test 5 retired 慣例 + 啟動 active_count()>=5 sanity check。
#
# Format / 格式:
#   <provider>:
#     <model_name>:
#       input_per_mtok: <usd>
#       output_per_mtok: <usd>
#       active: true|false        # if false, model is fail-closed (rejected by tracker)
#                                 # 若 false，模型 fail-closed（tracker 拒絕）

anthropic:
  # 現行型號（2026-06-14 對齊官方）/ current models
  claude-opus-4-8:
    input_per_mtok: 5.00
    output_per_mtok: 25.00
    active: true
  # claude-sonnet-5：2026-09-09 查核 https://platform.claude.com/docs/en/about-claude/pricing
  # $2/$10 per MTok 已成標準價；官方取消原訂 2026-09-01 的 $3/$15 調升。
  # 保留現有數值；只有新的官方定價 delta 才另行更新，不依過期日期自動改價。
  # 注意：sonnet-5 用新 tokenizer，同文本 tokens 約 +30%；記帳以 API 回報 usage 為準。
  claude-sonnet-5:
    input_per_mtok: 2.00
    output_per_mtok: 10.00
    active: true
  claude-sonnet-4-6:
    input_per_mtok: 3.00
    output_per_mtok: 15.00
    active: true
  claude-haiku-4-5:
    input_per_mtok: 1.00
    output_per_mtok: 5.00
    active: true
  # dated haiku id：Python MODEL_IDS[MODEL_HAIKU] 實送此名（provider_client.py），
  # 保留 active 以免 budget gate fail-closed 誤拒；與裸 claude-haiku-4-5 同價。
  # TODO(待核 AI-E#1)：haiku/opus/sonnet 真名後綴（dated alias vs 裸名）以
  #   console / API models list 為準，最終由 client.rs 實際送名對齊。
  claude-haiku-4-5-20251001:
    input_per_mtok: 1.00
    output_per_mtok: 5.00
    active: true
  # 退役型號 / retired（active:false → fail-closed，價不動，保留供歷史記帳對照）
  claude-sonnet-4-5:
    input_per_mtok: 3.00
    output_per_mtok: 15.00
    active: false
  claude-opus-4-6:
    input_per_mtok: 15.00
    output_per_mtok: 75.00
    active: false

